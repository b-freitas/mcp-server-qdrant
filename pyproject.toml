[project]
name = "mcp-server-qdrant-embeddings"
version = "0.2.0"
description = "Qdrant MCP server with multi-provider embedding support"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "qdrant-client>=1.12.0",
    "pydantic>=2.10.6,<2.12.0",
    "fastmcp==2.7.0",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.6.0"]
openai = ["openai>=1.0.0"]
vertexai = ["google-genai>=1.0.0"]
cohere = ["cohere>=5.13.0"]

[project.urls]
Repository = "https://github.com/b-freitas/mcp-server-qdrant"
Issues = "https://github.com/b-freitas/mcp-server-qdrant/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_qdrant_embeddings"]

[tool.uv]
dev-dependencies = [
    "ipdb>=0.13.13",
    "isort>=6.0.1",
    "mypy>=1.9.0",
    "pre-commit>=4.1.0",
    "pyright>=1.1.389",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[project.scripts]
mcp-server-qdrant-embeddings = "mcp_server_qdrant_embeddings.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
